services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: smartflow
      POSTGRES_USER: smartflow
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set the local database password in .env}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - smartflow_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartflow -d smartflow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  smartflow_postgres:
